# Cuesta College Women's Basketball — 2026-27 season schedule.
# Source: cuestaathletics.com/sports/wbkb/2026-27/schedule, drafted with scripts/import_schedule.py
# and cross-checked against the 3C2A feed (2026-11-06). Venues researched on each host's athletics site.
# This file is the single source of truth for the team: edit it, then run `make build`.
#
# Tournament wrapper rows on the official page (West Coast Shootout, Taft College Jamboree,
# Hinson's Tire Pros Classic) aren't games; their individual games are listed instead.
# replaces: [old-event-id] -> sync closes that old reminder issue and links it here.
# All times are Pacific (America/Los_Angeles). Games with no time are all-day events.

season: "2026-27"
team: Cuesta College Women's Basketball
short: WBB                        # issue title prefix / label text
ics: cuesta-wbb.ics               # this team's calendar feed (docs/)
id_prefix: "wbb-"                 # event ids must not collide with the men's (same date + opponent)
source_url: https://www.cuestaathletics.com/sports/wbkb/2026-27/schedule
feed_url: "https://www.cccaasports.org/sports/wbkb/2026-27/schedule?print=ical"   # official 3C2A feed, checked daily
feed_sport: "Women's Basketball"  # sport tag in the feed's event titles
results_fallback_url: "https://www.cccaasports.org/sports/wbkb/2026-27/teams/cuesta?view=schedule"
feed_aliases:                     # feed name -> our name
  to be announced: tba tom gilcrest tournament
feed_ignore:                      # "YYYY-MM-DD Opponent" feed entries we deliberately don't track
  - "2026-11-20 Hinson's Tire Pros Classic"   # wrapper; Mission + Skyline games are tracked
  - "2026-11-21 Hinson's Tire Pros Classic"
timezone: America/Los_Angeles
default_duration_min: 120
notify: [johnlinwiz]             # @-mentioned in reminder comments
follow: ["Jenn Stambaugh"]               # featured players: followed by default on the site (spotlight in Stats, line under each game) + box-score comment/email on the game issue
reminder_days_before: [7, 2, 0]   # GitHub issue reminder comments (0 = game day)

